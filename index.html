// ================================
// 随机风格
// ================================


function randomStyle(){

let keys=
Object.keys(corpus);

return keys[
Math.floor(
Math.random()*keys.length
)
];

}




// ================================
// 核心降重算法
// ================================


function rewriteText(text){


let style=
randomStyle();



let sentences=
text.match(
/[^。！？!?]+[。！？!?]/g
)
||
[text];



let result=[];



for(
let i=0;
i<sentences.length;
i++
){


result.push(
sentences[i]
);



// 20%-40%概率插入

if(

i < sentences.length-1

&&

Math.random()<0.35

){


let c=
connectors[style]
[
Math.floor(
Math.random()
*
connectors[style].length
)
];


let t=
corpus[style]
[
Math.floor(
Math.random()
*
corpus[style].length
)
];


result.push(
c+t
);


}


}



return result.join("");

}

document.getElementById("status");



let progress=0;



for(let s of steps){


status.innerHTML=s;


progress+=16.6;


bar.style.width=
progress+"%";


await sleep(500);


}


}

function downloadText(){

document.getElementById("output")
.value;



if(!text){

alert("暂无结果");

return;

}



let blob=
new Blob(
[text],
{
type:
"text/plain;charset=utf-8"
}
);



let url=
URL.createObjectURL(blob);



let a=
document.createElement("a");



a.href=url;


a.download=
"AI文本优化结果.txt";


a.click();



URL.revokeObjectURL(url);


}
